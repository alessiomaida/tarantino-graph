 inspired:['ha ispirato','ispirato da'],homage:['omaggiato in','omaggia'],cites:['citato in','cita'],music:['brano in','usa il brano'],adapted:['adattato in','tratto da'],name:['dà il nome a','prende il nome da'],chain:['ha ispirato','ispirato da'],
 created:['ha creato','creato da'],starred:['interprete in','interpretato da'],cameo:['cameo in','cameo di']};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const byId=new Map(D.nodes.map(n=>[n.id,n]));
const ALL=D.links.map((a,i)=>({key:i,sid:a[0],tid:a[1],source:a[0],target:a[1],rel:a[2],conf:a[3]||null,src:a[4]||null,url:a[5]||null}));
let nav=CFG.nav,expanded=new Set(),focus=null,depth=1,trail=[],fullLinks=[],fullVis=new Set(),hid={};
let mode='all',typeOn=new Set(Object.keys(TYPES)),confOn=new Set(CONFS.map(c=>c[0])),sel=null,hover=null,visSet=new Set(),visLinks=[];

function computeFull(){
 const base=n=>{
  if(!typeOn.has(n.type))return false;
  if(n.qt)return true;
  if(mode==='credits')return n.layer==='c';
  if(mode==='infl')return n.layer==='i'||!!n.bridge;
  return true;};
 const cand=D.nodes.filter(base),cid=new Set(cand.map(n=>n.id));
 const A=new Set(cand.filter(n=>n.qt).map(n=>n.id));
 const L=ALL.filter(l=>INFL_RELS.includes(l.rel)&&confOn.has(l.conf)&&cid.has(l.sid)&&cid.has(l.tid));
 for(let ch=true;ch;){ch=false;for(const l of L)if(A.has(l.tid)&&!A.has(l.sid)){A.add(l.sid);ch=true;}}
 const vis=new Set();
 for(const n of cand){
  if(n.qt){vis.add(n.id);continue;}
  if(n.ext)continue;
  if(n.layer==='i'&&WORK_TYPES.includes(n.type)){if(mode!=='credits'&&A.has(n.id))vis.add(n.id);}
  else if(n.layer==='i'||(n.bridge&&mode==='infl')){
   if(ALL.some(l=>(CREATOR_RELS.includes(l.rel)||INFL_RELS.includes(l.rel))&&confOn.has(l.conf)&&l.sid===n.id&&A.has(l.tid)&&cid.has(l.tid)))vis.add(n.id);
  } else vis.add(n.id);
 }
 const extN=cand.filter(n=>n.ext);
 for(let ch=true;ch;){ch=false;for(const n of extN){if(vis.has(n.id))continue;
  if(ALL.some(l=>confOn.has(l.conf)&&((l.sid===n.id&&vis.has(l.tid))||(l.tid===n.id&&vis.has(l.sid))))){vis.add(n.id);ch=true;}}}
 const vl=ALL.filter(l=>{
  if(!vis.has(l.sid)||!vis.has(l.tid))return false;
  if(l.conf&&!confOn.has(l.conf))return false;
  if(!l.conf&&mode==='infl'&&l.rel!=='directed'&&!byId.get(l.sid).bridge)return false;
  return true;});
 const nodes=D.nodes.filter(n=>vis.has(n.id));
 nodes.forEach(n=>n.deg=0);vl.forEach(l=>{byId.get(l.sid).deg++;byId.get(l.tid).deg++;});
 return{nodes,links:vl,vis};
}
function compute(){
 const f=computeFull();fullLinks=f.links;fullVis=f.vis;
 const adj=new Map();f.vis.forEach(id=>adj.set(id,[]));
 f.links.forEach(l=>{adj.get(l.sid).push(l.tid);adj.get(l.tid).push(l.sid);});
 let shown;
 if(nav==='full')shown=new Set(f.vis);
 else{
  if(focus&&!f.vis.has(focus)){focus=null;trail=[];}
  shown=new Set();
  if(focus){let fr=[focus];shown.add(focus);for(let i=0;i<depth;i++){const nx=[];fr.forEach(id=>adj.get(id).forEach(x=>{if(!shown.has(x)){shown.add(x);nx.push(x);}}));fr=nx;}}
  else{
   D.nodes.forEach(n=>{if(n.qt&&f.vis.has(n.id))shown.add(n.id);});
   for(let ch=true;ch;){ch=false;for(const e of expanded)if(shown.has(e))for(const x of adj.get(e)||[])if(!shown.has(x)){shown.add(x);ch=true;}}
  }
 }
 const nodes=D.nodes.filter(n=>shown.has(n.id));
 const links=f.links.filter(l=>shown.has(l.sid)&&shown.has(l.tid));
 nodes.forEach(n=>n.deg=0);links.forEach(l=>{byId.get(l.sid).deg++;byId.get(l.tid).deg++;});
 hid={};nodes.forEach(n=>{const c=(adj.get(n.id)||[]).filter(x=>!shown.has(x)).length;if(c)hid[n.id]=c;});
 return{nodes,links,vis:shown};
}

 .force('x',d3.forceX().strength(.035)).force('y',d3.forceY().strength(.035));

function nodeR(n){return n.id==='qt'?17:n.qt?12:Math.min(10,4.5+Math.sqrt(n.deg||1)*1.5);}
function pathFor(n){
 const r=nodeR(n),sh=TYPES[n.type][2];
 if(sh==='c')return d3.symbol(d3.symbolCircle,Math.PI*r*r)();
 const m={s:d3.symbolSquare,d:d3.symbolDiamond,t:d3.symbolTriangle,w:d3.symbolWye,x:d3.symbolCross}[sh];
 return d3.symbol(m,r*r*(sh==='d'?3.4:3.8))();

function showLabel(d){
 const k=d3.zoomTransform(svg.node()).k;
 if(nav!=='full'&&visSet.size<=45)return true;
 if(d===sel||d===hover||(sel&&nbrs(sel).has(d.id))||(hover&&nbrs(hover).has(d.id)))return true;
 if(d.qt)return true;

function nbrs(n){const s=new Set([n.id]);visLinks.forEach(l=>{if(l.sid===n.id)s.add(l.tid);if(l.tid===n.id)s.add(l.sid);});return s;}

 nodes.forEach(n=>{if(n.x===undefined){
   const l=links.find(l=>(l.sid===n.id||l.tid===n.id)&&byId.get(l.sid===n.id?l.tid:l.sid).x!==undefined);

  .attr('stroke-width',l=>l.conf==='dichiarato'?2.2:INFL_RELS.includes(l.rel)?1.4:1)
  .attr('stroke-dasharray',l=>l.conf?DASH[l.conf]:null)
  .attr('stroke',l=>INFL_RELS.includes(l.rel)?'#dc2626':CREATOR_RELS.includes(l.rel)?'#0891b2':null)
  .attr('stroke-opacity',l=>l.conf?.75:.55);
 nodeSel=gN.selectAll('g.n').data(nodes,d=>d.id).join(en=>{
   const g=en.append('g').attr('class','n').style('cursor','pointer');
   g.append('path');g.append('text').attr('class','lb').attr('text-anchor','middle');g.append('text').attr('class','bd');return g;})
  .on('click',(e,d)=>{e.stopPropagation();
   if(nav==='explore'){
    if(focus){if(d.id!==focus)goFocus(d.id);}
    else if(d.id!=='qt'&&(hid[d.id]||expanded.has(d.id))){expanded.has(d.id)?expanded.delete(d.id):expanded.add(d.id);update(true,.6);}
   }
   select(d);})
  .on('mouseenter',(e,d)=>{hover=d;paint();}).on('mouseleave',()=>{hover=null;paint();})
  .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
   .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
 nodeSel.select('path').attr('d',pathFor).attr('fill',d=>TYPES[d.type][1]).attr('stroke',d=>d.bridge?'#fbbf24':d.qt?'var(--tx)':'var(--bg)').attr('stroke-width',d=>d.bridge||d.qt?2.5:1.5);
 nodeSel.select('text.lb').text(d=>d.label+(d.year?' ('+d.year+')':'')).attr('dy',d=>nodeR(d)+12);
 nodeSel.select('text.bd').text(d=>hid[d.id]?'+'+hid[d.id]:'').attr('dx',d=>nodeR(d)+4).attr('dy',4);
 if(sel&&!vis.has(sel.id)){sel=null;document.getElementById('ip').style.display='none';}
 paint();updStats();updCounts();renderBar();
 sim.alpha(alpha).restart();if(refit)setTimeout(fit,1300);
}
function paint(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const f=hover||sel,nb=f?nbrs(f):null;
 nodeSel.classed('dim',d=>(nb&&!nb.has(d.id))||(q&&!d.label.toLowerCase().includes(q)&&!nb));
 linkSel.classed('dim',l=>nb&&!(l.sid===f.id||l.tid===f.id));
 if(q)nodeSel.classed('dim',d=>!d.label.toLowerCase().includes(q));
 updLabels();
}
function scaleLabels(){if(!nodeSel)return;const k=d3.zoomTransform(svg.node()).k;
 nodeSel.select('text.lb').style('font-size',(11/k)+'px').style('stroke-width',(3/k)+'px').attr('dy',d=>nodeR(d)+12/k);
 nodeSel.select('text.bd').style('font-size',(10/k)+'px').attr('dx',d=>nodeR(d)+4/k).attr('dy',4/k);}
function updLabels(){scaleLabels();if(nodeSel)nodeSel.select('text.lb').style('display',d=>showLabel(d)?null:'none');}
sim.on('tick',()=>{
 linkSel.attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);
 nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
});
function fit(){
 const ns=sim.nodes();if(!ns.length)return;
 const [w,h]=size();const x0=d3.min(ns,d=>d.x),x1=d3.max(ns,d=>d.x),y0=d3.min(ns,d=>d.y),y1=d3.max(ns,d=>d.y);
 const k=Math.min(1.1,.88/Math.max((x1-x0)/w,(y1-y0)/h,.01));
 const t=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k);
 svg.transition().duration(500).call(zoom.transform,t);
}
svg.on('click',()=>{sel=null;document.getElementById('ip').style.display='none';paint();});

function select(d){
 sel=d;paint();
 const ip=document.getElementById('ip'),T=TYPES[d.type];
 const items=fullLinks.filter(l=>l.sid===d.id||l.tid===d.id).map(l=>{
  const out=l.sid===d.id,o=byId.get(out?l.tid:l.sid);
  return`<li${visSet.has(o.id)?'':' class="hid"'}><span class="rt">${RELT[l.rel][out?0:1]}</span> <a class="go" data-id="${o.id}">${esc(o.label)}</a>${o.year?' <span class="rt">('+o.year+')</span>':''}${o.bridge?' <span class="cf">ponte</span>':''}`+
   (l.conf?`<span class="cf">${l.conf}</span>`:'')+(l.url?`<span class="src">Fonte: <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.src)}</a></span>`:'')+'</li>';}).join('');
 const act=nav==='full'||focus===d.id?'':'<div class="act"><button data-a="focus">Focus su questo nodo</button>'+(expanded.has(d.id)?'<button data-a="col">Comprimi</button>':'')+'</div>';
 ip.innerHTML=`<button class="x" aria-label="Chiudi">×</button><span class="pill" style="background:${T[1]}">${T[0]}</span>${d.bridge?' <span class="pill" style="background:#f59e0b">ponte crediti ↔ influenze</span>':''}
  <h3>${esc(d.label)}${d.year?' <span style="color:var(--mut);font-weight:400">('+d.year+')</span>':''}</h3><p>${esc(d.info||'')}</p>
  <div style="color:var(--mut);font-size:12px">${fullLinks.filter(l=>l.sid===d.id||l.tid===d.id).length} collegamenti${hid[d.id]?' · '+hid[d.id]+' nascosti':''}</div>${act}<ul>${items}</ul>`;
 ip.style.display='block';
 ip.querySelector('.x').onclick=()=>{sel=null;ip.style.display='none';paint();};
 ip.querySelectorAll('a.go').forEach(a=>a.onclick=()=>{const n=byId.get(a.dataset.id);if(!n)return;
  if(focus)goFocus(n.id);else if(!visSet.has(n.id)){expanded.add(d.id);update(true,.6);}
  select(n);});
 ip.querySelectorAll('.act button').forEach(b=>b.onclick=()=>{
  if(b.dataset.a==='focus'){goFocus(d.id);select(d);}
  else{expanded.delete(d.id);update(true,.6);select(d);}});
}

function goFocus(id,push=true){focus=id;if(push&&trail[trail.length-1]!==id)trail.push(id);update(true);}
function exitFocus(){focus=null;trail=[];update(true);}
function renderBar(){
 const fb=document.getElementById('fb');
 if(!focus||nav==='full'){fb.style.display='none';return;}
 fb.style.display='flex';
 fb.innerHTML=`<button data-a="back" ${trail.length<2?'disabled':''}>←</button><span class="crumbs">`+trail.map((id,i)=>`<a data-i="${i}" class="${i===trail.length-1?'cur':''}">${esc(byId.get(id).label)}</a>`).join(' › ')+`</span><span>Salti <button data-d="1" class="${depth===1?'on':''}">1</button> <button data-d="2" class="${depth===2?'on':''}">2</button> <button data-d="3" class="${depth===3?'on':''}">3</button></span><button data-a="exit">Esci dal focus</button>`;
 fb.onclick=e=>{const x=e.target;
  if(x.dataset.a==='back'&&trail.length>1){trail.pop();goFocus(trail[trail.length-1],false);}
  else if(x.dataset.a==='exit')exitFocus();
  else if(x.dataset.d){depth=+x.dataset.d;update(true);}
  else if(x.dataset.i!==undefined){trail=trail.slice(0,+x.dataset.i+1);goFocus(trail[trail.length-1],false);}};
}
function hint(){document.getElementById('navhint').textContent=nav==='explore'?'Clicca un nodo per aprirlo o chiuderlo. «+n» = collegamenti ancora nascosti. Dal pannello puoi fare Focus.':'Tutto il grafo visibile insieme, come nella v2.';}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{nav=b.dataset.n;focus=null;trail=[];document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));hint();update(true);});
document.getElementById('collapse').onclick=()=>{expanded.clear();focus=null;trail=[];update(true);};
hint();
function buildJump(){
 const J=D.nodes.filter(n=>n.jump);if(!J.length)document.getElementById('jumpbox').style.display='none';
 const el=document.getElementById('jump');
 el.innerHTML=J.map(n=>`<div class="chip" data-id="${n.id}"><span>${esc(n.label)}</span></div>`).join('');
 el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  const n=byId.get(c.dataset.id);if(!fullVis.has(n.id))return;
  nav='explore';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.n==='explore'));hint();
  trail=[];depth=1;goFocus(n.id);select(n);});
}
function shapeSvg(t){
 const c=TYPES[t][1],s=TYPES[t][2];
 const p={c:'<circle cx="7" cy="7" r="5.5"/>',s:'<rect x="1.5" y="1.5" width="11" height="11"/>',d:'<path d="M7 0.5L13.5 7L7 13.5L0.5 7Z"/>',t:'<path d="M7 1L13 12.5H1Z"/>',w:'<path d="M5.5 1h3v4.5L13 8.2l-1.5 2.6L7 8.2 2.5 10.8 1 8.2l4.5-2.7z"/>',x:'<path d="M5 1h4v4h4v4H9v4H5V9H1V5h4z"/>'}[s];
 return`<svg width="14" height="14" viewBox="0 0 14 14" fill="${c}">${p}</svg>`;
}
const tot={};D.nodes.forEach(n=>tot[n.type]=(tot[n.type]||0)+1);
function buildChips(el,types){
 el.innerHTML=types.map(t=>`<div class="chip" data-t="${t}">${shapeSvg(t)}<span>${TYPES[t][0]}</span><span class="n">${tot[t]||0}</span></div>`).join('');
 el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const t=c.dataset.t;typeOn.has(t)?typeOn.delete(t):typeOn.add(t);c.classList.toggle('off',!typeOn.has(t));update();});
}
buildChips(document.getElementById('tw'),WORK_TYPES);buildChips(document.getElementById('tp'),PERSON_TYPES);
document.getElementById('cf').innerHTML=CONFS.map(([k,l])=>{
 const d=DASH[k];return`<div class="chip" data-c="${k}"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#dc2626" stroke-width="${k==='dichiarato'?2.4:1.5}" ${d?`stroke-dasharray="${d}"`:''}/></svg><span>${l}</span></div>`;}).join('');
document.querySelectorAll('#cf .chip').forEach(c=>c.onclick=()=>{const k=c.dataset.c;confOn.has(k)?confOn.delete(k):confOn.add(k);c.classList.toggle('off',!confOn.has(k));update();});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));update();});
function updStats(){document.getElementById('stats').textContent=`${visSet.size} nodi visibili (su ${fullVis.size}) · ${visLinks.length} collegamenti`;}
function updCounts(){}
const qi=document.getElementById('q');
qi.oninput=()=>{paint();const q=qi.value.trim().toLowerCase();if(q){const m=sim.nodes().find(d=>d.label.toLowerCase().includes(q));if(m)select(m);}};
qi.onkeydown=e=>{if(e.key!=='Enter')return;const q=qi.value.trim().toLowerCase();if(!q)return;
 const m=D.nodes.find(d=>fullVis.has(d.id)&&d.label.toLowerCase().includes(q));
 if(m&&!visSet.has(m.id)){if(nav==='explore')goFocus(m.id);qi.value='';select(m);}};
document.getElementById('fit').onclick=fit;
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';};
window.addEventListener('resize',fit);
document.title='Tarantino · Grafo delle influenze ('+['v2 Completo','v3 Esplora','v4 Registi'][CFG.ver-2]+')';
document.querySelectorAll('.ver a').forEach((a,i)=>a.classList.toggle('on',i===CFG.ver-2));
if(!CFG.showNav)document.getElementById('navbox').style.display='none';
document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.n===nav));hint();
update();buildJump();
</script>
</body>
</html>
